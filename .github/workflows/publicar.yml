name: Publicar web en el hosting
on:
  push:
    branches: [main]
    paths: ['sitio/**', '.github/workflows/publicar.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: publicar-web
env:
  FTP_SERVER: apolo.tuwebamedida.com
  FTP_USER: plataformalactea
jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Subir por FTPS los archivos nuevos o cambiados
        id: subir
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BEFORE: ${{ github.event.before }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq lftp >/dev/null
          mkdir -p registro
          # Archivos cambiados en este envío (se suben siempre, aunque el tamaño no cambie)
          : > cambios.lftp
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- sitio/ | while read -r f; do
              rel="${f#sitio/}"; d=$(dirname "$rel")
              [ "$d" = "." ] && echo "put \"$f\" -o \"$rel\"" >> cambios.lftp || echo "mkdir -p -f \"$d\"; put \"$f\" -o \"$rel\"" >> cambios.lftp
            done
          fi
          {
            echo "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true"
            echo "set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5"
            echo "open -u \"$FTP_USER\",\"$FTP_PASSWORD\" $FTP_SERVER"
            echo "mirror -R --ignore-time --no-perms --parallel=3 --verbose=1 sitio/ ./"
            cat cambios.lftp
            echo "bye"
          } > script.lftp
          set +e
          lftp -f script.lftp > salida.txt 2>&1
          code=$?
          rm -f script.lftp
          { date -u; echo "codigo lftp: $code"; echo "cambiados en este envio: $(wc -l < cambios.lftp)"; echo "--- detalle ---"; grep -v -i "pass" salida.txt | tail -60; } > registro/ftp.txt
          exit $code
      - name: Guardar registro en el repositorio
        if: always()
        run: |
          echo "subida: ${{ steps.subir.outcome }}" >> registro/ftp.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add registro/ftp.txt
          git commit -m "Registro de publicación" || true
          git pull --rebase -q || true
          git push || true
